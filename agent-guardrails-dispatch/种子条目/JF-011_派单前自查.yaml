id: JF-011
名称: 体力活派单自查
事件: PreToolUse
# ⭐ collaborationspawn_agent 是 codex 实测到的原始工具名；Agent/Task 是本宿主的名字。
#   ⛔ 两边都盯——换个宿主就瞎，正是本库最怕的静默失效。
工具正则: '^(Agent|Task|Workflow|collaborationspawn_agent)$'
# ⭐⭐ 2026-08-20 用户更正拍板（推翻 08-19 那版阶梯）：**每轮至多硬拦一次、会话至多 3 次**；
#   没拦的那些次，**只要没显式选档就每次都提醒**（⛔ 没有静默档——「漏一次可能烧掉半周配额」，
#   真事故：Fable 5 xhigh 主窗 ×20 个继承子代理）。显式选了档 ⇒ 不拦不扰。
#   ⚠️ 老注释里「冷却必须是 1」是给旧处置 拦一次 写的 ⇒ 本处置**不读冷却**（引擎豁免），
#   逃生口变成「本轮已拦过 ⇒ 重发落进提醒档放行」——⛔ 照样不死循环（回归有断言）。
处置: 每轮拦一次
会话拦截上限: 3
显式选档放行: true
作用域: 全局
条件: 本项目已配派单
注入文本: |
  【纠偏 · 体力活派单自查】你正要起子代理／批量作业。**本项目配了 codex 派单通道**——
  ⭐ 它比起子代理便宜得多，而用户的配额正在吃紧。先花十秒答三问：

  ① **这活是不是体力活？**（盘点／抓取／扫描／计数／建索引／逐文件核对／跑回归）
     是 ⇒ **派给 codex**，⛔ 别自己拉一队子代理。
     你的位置是**写 prompt、拆单、验收、终裁**。

  ② **工具能不能直接算出来？**（计数、行号、diff、比对）
     能 ⇒ 连 codex 都不必派。**零模型最便宜也最准。**

  ③ **要派的话，档位选哪一档？**⛔ 不许一刀切 —— 四档摆在这儿，照任务性质挑：

     | 预设 | 什么活 | 主模型/档 | 子代理/档 | 沙箱 |
     |---|---|---|---|---|
     | `抓取` | 取数、扒文件、建索引 | luna/low | terra/low | 只读 |
     | `勘察` | 摸清现状、找东西在哪 | luna/low | terra/low | 只读 |
     | `审计` | 对账、核实、逐条比对 | terra/medium | terra/low | 只读 |
     | `实现` | 真的要改代码 | sol/medium | terra/low | 可写 |

     ⇒ **命令就一行**（任务书先写成 md，⛔ 别把长 prompt 塞进命令行）：
     `python {工具目录}/codex派单.py 派 --单 <任务书.md> --预设 <上表某一档>`
     ⭐ 跑完它**自动体检**（读 codex 的原始记录，⛔ 不采信自述），退出码 0 绿 / 2 黄 / 3 红。
     ⚠️ 拿不准挑哪档 ⇒ `python {工具目录}/codex派单.py 配置` 打印本项目生效的全表。

  ⇒ 三问过完仍判定**该自己起子代理** ⇒ **原样再发一次同一调用即放行**
     （这一拦每轮只有一次、会话内至多 3 次；之后没显式选档的每次都会被提醒）。
     ⭐ 但那时请显式传模型与档位 —— **不显式传 ＝ 继承你自己的档 ＝ 整队按最贵的档跑**
     （那正是本条的来源事故：6 个顶配子代理，63 万 token）。
# ⚠️ 本字段必须排在 来源事故: 之前 —— 打包从那儿切开换脱敏版，排后面会被切丢（2026-08-19 实测踩过）
提醒文本: |
  【提醒 · ⛔ 不拦】这次起子代理**没显式选档** ⇒ 会继承你的模型和思考档。
  ⭐ 先想一秒：这活派单通道是不是更便宜？自己起 ⇒ 调用带 `model` 参数、
  编排里逐个给 `model:`＋`effort:`。⭐ 显式选了档，这条提醒就不会再出现。
来源事故: |
  一次本该派给外部执行器的体力活（读台账、扫代码、数常量这类铺开与核对），
  主窗却自己拉了 6 个**顶配**子代理去干，烧掉 63 万 token 才被发现。
  ⚠️ 逐项查过：脚本在、引擎在、档位表完好、钩子都挂着 ⇒ ⛔ 不是故障。
  真失效点：这条纪律**只有文档载体、没有执行载体** ——
  事后提醒太晚（活已经派出去了）、收工提醒更晚（钱已经花完了），
  ⭐ 只有「正要动手」那一刻拦得住。
