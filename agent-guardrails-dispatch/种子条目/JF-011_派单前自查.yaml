# 示范条目（随插件附带的样本）。⭐ 它是给你看「一条规矩长什么样」的，
# ⛔ 不是「推荐配置」——真正有用的规矩得从你自己的事故里长出来。
# 改它、删它都行；生效区里的文件归你，升级插件⛔ 不会覆盖。
id: JF-011
名称: 体力活派单自查
事件: PreToolUse
工具正则: '^(Agent|Task|Workflow)$'
处置: 拦一次
冷却: 1
作用域: 全局
条件: 本项目已配派单
注入文本: |
  【纠偏 · 体力活派单自查】你正要起子代理／批量作业，而本项目**配了派单通道**
  （`{配置目录}/工作流.yaml` 里的档位表 ＋ `{工具目录}` 里的派单脚本）。先答三问再决定：
  ① 这活是不是**盘点／抓取／扫描／计数／建索引／逐文件核对**这类体力活？
     是 ⇒ 它该走派单通道交给外部执行器。主窗的位置是**写 prompt、拆单、验收、终裁**，
     ⛔ 不是自己拉一队子代理下场——那既绕开了档位规划，也绕开了事后的行为体检。
  ② 计数、行号、diff、比对这类**工具就能算出来的**，还需要模型吗？零模型最便宜也最准。
  ③ 若确实该自己起：子代理的**模型与档位是你显式规划过的吗**？
     不显式传 ＝ 继承你自己的档 ＝ 整队按最贵的档跑（这正是本条的来源事故）。
  ⇒ 自查完仍判定该自己起 ⇒ **原样再发一次同一调用即放行**（本会话只拦这一次）。
来源事故: |
  一次本该派给外部执行器的体力活（读台账、扫代码、数常量这类铺开与核对），
  主窗却自己拉了 6 个**顶配**子代理去干，烧掉 63 万 token 才被发现。
  ⚠️ 逐项查过：脚本在、引擎在、档位表完好、钩子都挂着 ⇒ ⛔ 不是故障。
  真失效点：这条纪律**只有文档载体、没有执行载体** ——
  事后提醒太晚（活已经派出去了）、收工提醒更晚（钱已经花完了），
  ⭐ 只有「正要动手」那一刻拦得住。
