# 示范条目（随插件附带的样本）。⭐ 它是给你看「一条规矩长什么样」的，
# ⛔ 不是「推荐配置」——真正有用的规矩得从你自己的事故里长出来。
# 改它、删它都行；生效区里的文件归你，升级插件⛔ 不会覆盖。
id: JF-018
名称: 同名不等于同一份
事件: PreToolUse
目标: 命令
触发正则: '(\brm\s+-[a-zA-Z]*r[a-zA-Z]*\s|\bshutil\.rmtree\b|\brmtree\s*\(|Remove-Item\b[^\n]*-Recurse|\brmdir\s+/[sS])'
工具正则: '(Bash|PowerShell)'
处置: 拦一次
冷却: 1
作用域: 全局
注入文本: |
  【纠偏 · 「内容完全相同」分不出「两份」和「同一份」】你正要**递归删除一个目录**。
  动手前先答一句：**你凭什么认为它是独立的一份，而不是别处那一份的链接？**

  ⇒ 逐条自查：
  ① **你的比对方法有没有这个盲区？**——逐文件比对、哈希比对、版本号比对，
     在「两个名字指向同一份东西」时**全都返回"完全相同"**。
     ⛔ 「相同」不是"这是重复副本"的证据；它同时也是"这就是同一个"的证据。
     ⚠️ 越是"零差异、干净利落"的比对结果，越要先过这一关。
  ② **看目录项本身的类型，⛔ 不是看它里面装了什么。**
     列目录时的类型位／属性标记／读链接目标这类操作才回答这个问题；
     进到里面去比内容，无论比得多细，都回答不了。
  ③ **若它确实是链接**：删链接和删目标是后果完全不同的两件事，
     而多数递归删除命令会**跟着链接把目标一起删掉**。
  ④ **删之前确认内容别处还有一份能取回**（远端／备份／版本库）。
     取不回 ⇒ ⛔ 先取回再删，⛔ 别指望"应该还有"。

  ⭐ 同形的坑一律适用：清理"重复文件"、合并"重复目录"、删"多余副本"——
  凡是拿「内容一致」当删除依据的，都要先确认那两个名字**不是同一个东西**。
来源事故: |
  拿「内容完全相同」当删除依据，删掉了一个**指向别处的链接**。
  ⚠️ 逐文件比对、哈希比对，在「两个名字指向同一份东西」时**全都返回「完全相同」**
  ⇒ 「相同」⛔ 不是「这是重复副本」的证据，它同时也是「这就是同一个」的证据。
  ⭐ 越是「零差异、干净利落」的比对结果，越要先过这一关。
