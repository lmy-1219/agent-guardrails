id: JF-030
名称: 起子代理前先挑一档
事件: PreToolUse
工具正则: ^(Agent|Task|Workflow|collaborationspawn_agent)$
# ⭐⭐ 2026-08-20 用户更正拍板（推翻 08-19 那版阶梯）：**每轮至多硬拦一次、会话至多 3 次**；
#   没拦的那些次，**只要没显式选档就每次都提醒**（⛔ 没有静默档——判据：
#   漏拦一次的代价可能是大半周配额；真实事故形状：高档主窗 ×20 个继承子代理）。
#   显式选了档（带 model / 脚本里给 model:/effort:）⇒ 不拦不扰。冷却字段对本处置无效。
处置: 每轮拦一次
会话拦截上限: 3
显式选档放行: true
作用域: 全局
# ⭐ 两个条件都要成立才响：⛔ 不抢 JF-011 的活（已配派单）、⛔ 不抢 codex 自带那条的活（codex 宿主）
条件: [本项目未配派单, 非codex宿主]
注入文本: |
  【纠偏 · 起子代理前先挑一档】你正要起子代理／批量作业。
  ⭐ 本项目**没配外部派单通道** ⇒ 这一队会实实在在跑在**你这个平台上**、花你这边的额度。

  ⚠️ **⛔ 不显式传档位 ＝ 整队继承你自己的档** —— 而你多半就是此刻这台机上最贵的那一档。

  ⭐ 花十秒答三问（⛔ 不是要你别派，是要你**挑一次**）：

  ① **这活要不要"想"？**
     · 铺开、计数、抓取、建索引、逐文件核对、跑回归 ⇒
       ⭐ **先看工具能不能直接算出来** —— 零模型最便宜，而且**最准**。
     · 真需要判断力、要读上下文才做得了 ⇒ ⭐ 那才值得起子代理。

  ② **起的话，这一队里每个都该同一档吗？**
     ⭐ 常见的对法是**分开挑**：铺开／取数／照单核对那几个走低档，
     **只有做对抗性核验、终裁、要下判断的那一两个**走高档。
     ⇒ ⭐ 同一队里档位不同**是正常的**，⛔ 一刀切才是要治的那件事。

  ③ ⭐⭐ **孙代理呢？** —— 子代理再起子代理，**同样继承**。
     ⇒ 起一队「会自己再起人」的子代理时，档位是**乘出去的**：
       一个高档主窗 → 五个继承的子 → 各自再起三个孙 ＝ 十几个都按最贵的档在跑。
     ⭐ 派之前说清楚「你起下手时用哪一档」，比事后看账单便宜得多。

  ⭐ **怎么传**：你手上那个起子代理的工具，**自带一个指定模型的参数**；
    编排类的（一次铺开很多个的那种）通常还能**按每个 agent 单独指定推理档位**。
    ⚠️ ⛔ **别照抄任何一张写死的档位名单** —— 各版本可选值不一样，抄来的名字可能根本不存在。
    ⇒ ⭐ **去看你手上那个工具自己的参数说明**，那上面写的才是此刻真实可选的。

  ⭐ 这一拦**每轮只有一次**（会话内至多 3 次）：你判定这一轮就是要起高档位/本平台子代理
    ⇒ **原样再发即放行**。⭐ 之后凡是**没显式选档**的子代理调用，每次都会附一条提醒。
  ⭐ **出口（挑过了就走，⛔ 不用回来交代）**：
    · 「这一队确实每个都要判断力，我要全走高档」 ⇒ ⭐ 正当结论，**说一句为什么**就继续。
    · 「我已经按活的性质分别挑过了」 ⇒ ⭐ 那就走，这条提醒的目的已经达到。
    · 「这活其实工具就能算」 ⇒ ⭐ 最好的结局，连子代理都省了。
与相邻条目的分工: |
  · **JF-011（体力活派单自查）** —— 条件是「**本项目已配派单**」，
    它的重点是**把体力活推给外部执行器**（比起子代理便宜得多），
    那张四档表是**外部执行器的档位**。
  · **本条 JF-030** —— 条件是「**本项目未配派单**」，
    重点是**在本平台内部把档位挑对**（⛔ 没有外部通道可推）。
  ⭐⭐ 两条**同一个触发、条件互斥** ⇒ **永远不会同时响**，
    ⛔ 不是往同一个位置再堆一条分支（那正是「规则越堆越多、没人说得清哪条先生效」的病）。
  ⭐ 判据一句话：**有外部通道 ⇒ 先想推出去（JF-011）；没有 ⇒ 至少把档挑对（本条）。**
# ⚠️ 本字段必须排在 来源事故: 之前 —— 打包从那儿切开换脱敏版，排后面会被切丢（2026-08-19 实测踩过）
提醒文本: |
  【提醒 · ⛔ 不拦】这次起子代理**没显式选档** ⇒ 整队会继承你的模型和思考档。
  ⭐ 怎么选：起子代理的调用带 `model` 参数（sonnet／haiku 干铺开抓取绰绰有余）；
  编排脚本里每个 agent 可单独给 `model:`＋`effort:`（低档干体力、高档只留给终裁）。
  ⭐ 显式选了档，这条提醒就不会再出现。
来源事故: |
  起子代理时如果不显式指定模型与推理档位，**子代理继承主代理的档**，孙代理再继承一层
  ⇒ 一队十几个全按最贵的档跑。2026-08-12 就是这么烧掉 63 万 token 的。
  ⚠️ 那次立的 JF-011 带「本项目已配派单」条件 ⇒ 没配派单的项目一直是**没人管**的。
