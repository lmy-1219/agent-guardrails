id: JF-003
名称: 熔断触顶
事件: PostToolUse
目标: 连败序列
连败阈值: 3
冷却: 2
作用域: 全局
注入文本: |
  【纠偏 · 熔断触顶】连续 ≥3 次工具报错。⛔ 别原地第 4 次重试同一招。分清三种情形：
  · 同一位置的瞬时失败（网络抖动 / 句柄占用）：有限重试、间隔递增——这不算原地打转
  · 换手段：换位置 / 换工具 / 换写法，各试一次即止，⛔ 不在同一手段上加码
  · 修同一个缺陷：两次不成就停，换思路或带着已试记录求助
  ⇒ 现在就选：换一条路，或停下向用户举证报告——⛔ 别让失败序列继续变长。
来源事故: |
  同一个失败在原地重试到第四、第五次，每次只改一点点措辞。
  ⇒ 失败序列越拖越长，而真因一次都没被碰到。
  ⭐ 两次不成就该换手段或停下来求助——**停止不是失败**。
