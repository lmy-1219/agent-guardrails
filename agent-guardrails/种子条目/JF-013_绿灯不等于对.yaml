# 示范条目（随插件附带的样本）。⭐ 它是给你看「一条规矩长什么样」的，
# ⛔ 不是「推荐配置」——真正有用的规矩得从你自己的事故里长出来。
# 改它、删它都行；生效区里的文件归你，升级插件⛔ 不会覆盖。
id: JF-013
名称: 绿灯不等于对
事件: Stop
目标: 回复文本
触发正则: '(?<![没未不])(全绿|全部(通过|过了)|全都通过|全过了?|一次(过|通过)|(测试|用例|断言|回归|核销)(全部)?(通过|全过)(?!率)|验收(通过|合格|无误)|[Aa]ll tests? passed|(除|除了)[^。\n]{0,14}(外|以外)(全绿|全过|全都?通过)|仍(只|剩)\s*\d+\s*红|\d+\s*(个|条)?\s*(测试|用例|断言)[^。\n]{0,10}(通过|全绿|全过)(?!率))'
冷却: 1
作用域: 全局
注入文本: |
  【纠偏 · 绿灯不等于对】你正要拿「通过 / 全绿 / 验收合格」当结论。⭐ 绿灯只说明
  **「工具和它作者当时的想法一致」**，⛔ 不说明它对。收工前逐条自查这三问：

  ① **这段代码 / 这条规则是为了什么写的？** 是为了**真正解决这一类问题**，
     还是为了**让眼前这一个用例过去**？——判据旁边写不出「它凭什么是这个值 / 这个条件」的，
     多半属于后者。⛔ 「跑通了就先这样」是把下一次返工提前买单。
  ② **它和已有的规则重不重、打不打架？** 同类判定是不是**已经有一条**在管？
     两条同时命中时**谁说了算**——是写下来的优先级，还是碰巧的代码顺序？
     ⛔ 「再加一条分支」是最贵的省事：规则越堆越多，没人说得清哪条先生效。
  ③ **这次「绿」是怎么来的？** 真跑出来的，还是静态推断 / 语法检查 / 「应该会过」？
     用来验的样本是**真实数据**，还是自己造出来的假数据？——
     ⚠️ 自造数据按被验对象的假设生成 ⇒ **必然通过**，它证明不了任何事。

  ④ ⭐⭐ **这个「绿」有没有能力变红？——你故意把它弄坏过一次吗？**
     ⛔ 没弄坏过 ⇒ 你只知道「它这次是绿的」，⛔ 不知道「它**在该红的时候**会不会红」。
     ⇒ 花一分钟：把被它守着的那个东西**改坏一处**（删掉关键一行、把顺序调反、让它返回空），
       重跑一次——**它必须红**。⛔ 不红 ⇒ 这个绿灯从头到尾没在守任何东西。
     ⚠️ 最容易骗过人的三种「假绿」，逐个对一下：
       · **否定式判定**——「输出里没有『失败』字样就算过」⇒ 输出**被吞成空**时反而通过；
       · **各读各的**——检查的一方自己另实现一遍规则 ⇒ 和被检查方**不同调**，它照样报绿；
       · **自造样本**——用例按被验对象的假设造 ⇒ **必然绿**。
     ⭐ 判据一句话：**「改完」的判据⛔ 不是它变绿了，是「故意弄坏它会不会红」。**

  ⭐ 还有一条最容易漏的：**没被触发过的规则＝没验过，⛔ 不算通过。**
  报「全过」之前先答：这一轮**哪些规则一次都没被走到**？答不出来，「全过」就只是「跑到的那部分过了」。
  ⇒ ⭐ 正确的收尾是**如实分档**：真跑且用真样本验过的 / 跑了但用的是自造样本 / 压根没被触发到。
来源事故: |
  拿「测试全绿」当结论交付。⚠️ 绿灯只说明**工具和它作者当时的想法一致**，
  ⛔ 不说明它对：用来验的样本多半是自己造的（按被验对象自己的假设生成 ⇒ 必然通过），
  而**没被触发过的规则 ＝ 没验过**——报「全都通过」之前得先答得出
  「这一轮哪些规则一次都没被走到」。
