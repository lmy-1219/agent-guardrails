id: JF-102
名称: 较真不是施压
事件: UserPromptSubmit
目标: 用户输入
# ⭐ 只收**明确的否定/打回**词。⛔ 故意不收「怎么样了」「再看看」这类中性追问——
#   本条要治的是**被否定之后的收缩**，⛔ 不是每一次追问都要提醒一遍。
# ⚠️ 「你确定」收进来了：它是「较真」最典型的形态，而用户的原话点名了「追问、较真」。
触发正则: '(不行|不对|不通过|没通过|不合格|驳回|打回|否决|不认可|不同意|退回|重做|重来|再来一次|你错了|你搞错|搞错了|弄错了|不是我要的|不是这个意思|没做到|没实现|白做|又错|还是不对|怎么还是|你确定|实测仍未|说了没做|漏做)'
冷却: 3
作用域: 全局
注入文本: |
  【纠偏 · 较真不是施压】⭐ 先答一句：**用户这条是在否定你的结果吗？**
  ⛔ 不是（他只是在问、在补充、在说别的事）⇒ 说一句「不是否定，继续」就走，⛔ 别改任何东西。

  ⭐ **是**的话——用户的反驳、追问、较真⛔ 不是情绪施压，是在要求更全面、更严谨的帮助：
  ⛔ 被否定后禁止转入保守模式：**缩小范围、防御性措辞、只修被点名的那一个点**，都算。
  正确反应：把被点破的问题当成「**一类问题**」的样本，主动排查同类、一次修一类——
  ⛔ 不要让用户靠不停追问来逐个堵漏。该认的错要认，**认错之后投入力度不减、覆盖面不缩**。
来源事故: |
  使用者连续反驳／追问几次之后，模型转入保守模式：缩小范围、防御性措辞、
  只修被点名的那一个点。⇒ 这是 AI 对使用者行为形成的**坏负反馈**——
  「较真」被当成了「施压」，而它其实是在要求更严谨的帮助。
