# 示范条目（随插件附带的样本）。⭐ 它是给你看「一条规矩长什么样」的，
# ⛔ 不是「推荐配置」——真正有用的规矩得从你自己的事故里长出来。
# 改它、删它都行；生效区里的文件归你，升级插件⛔ 不会覆盖。
id: JF-103
名称: 候选蒸馏
事件: Stop
目标: 回复文本
# ⚠️ 必须单行（沿用 JF-022 踩过的坑：YAML 折行会插空格 ⇒ 正则永远咬不住）
# ⭐ 咬的是「收工时承认撞了事故 / 被纠正」这类措辞——那正是该蒸馏的信号。
触发正则: '(我(又一次|再一次|又)?(犯了|错了|搞错|理解错|做错|走偏|判断失误)|自曝|(用户|你)(点破|点名纠正|纠正了我|反驳得对)|这次(的)?(事故|教训)|同一个(错|病|形状)|又一次同形|踩了[^。\n]{0,6}坑)'
处置: 拦一次
冷却: 1
作用域: 全局
注入文本: |
  【纠偏 · 候选蒸馏】你刚提到一次事故 / 一次被纠正。收工前判断一次：这是跨项目的人机协作病
  （不依赖某个项目的业务知识），还是项目特有？
  · 用户纠正了你的协作方式
  · 你撞了一次明显的流程事故
  · 发生了人机协作事故——AI 对用户使用行为形成坏的负反馈模式（例：被反驳 / 否定几次后
    就不敢输出、转入一味顺从收缩）
  · 跨项目通用 ⇒ 写一条候选进**候选区**：`{候选区}`
    （格式与入库门槛写在那个目录的 README 里，⭐ 动笔前先读它；触发设计＋来源事故必填，
    注入文本用通用措辞），⛔ 不许直接写进**生效区** `{生效区}`——生效必须用户批准。
  · 项目特有 ⇒ 落该项目自己的台账，⛔ 不进纠偏库。
  拿不准算哪类就写进候选区并注明存疑——候选区里放错无害，漏掉才亏。
来源事故: |
  「让规则库自己长」这件事，原本只写在候选区的 README 和某一个项目的记忆里
  ⇒ 换一个项目的窗口不保证读得到 ⇒ 闭环当场断链。
  ⇒ 本条是为它造的「每窗必到」的载体。⭐ 载体比自觉可靠。
