id: JF-105
名称: 装了不等于能用
事件: 常驻
作用域: 全局
注入文本: |
  【常驻 · 「装了」不等于「能用」】⭐ 判据一条：**有没有一次真实的东西，从头到尾流过去过？**
  ⛔ 没有 ⇒ 下列"成立"都不算数（它们都是在**没有真实需求流经**时得出的）：
    · 功能都做了、数据也齐了 ⇒ **没人把它们接起来** ⇒ 用不了；
    · 机制装上了、脚本在跑 ⇒ **盯的是空的／没声明／找不到依赖** ⇒ 永远不会叫；
    · 测试跑了而且全绿 ⇒ **夹具按被验对象的假设造** ⇒ 必然绿。
  ⭐⭐ 同一个形状：**「不通」和「通了但暂时没事」长得一模一样。**
  ⇒ ⛔ 别逐件再检查一遍（逐件本来就都过），要做的是：
  ① **端到端走一次真的**：一份真输入 → 走到最后 → 看最终产物；交付时明写**这次是怎么流过去的**
     （哪份输入·哪几环·产物是什么）。⛔ 走不通就说卡在哪一环，⛔ 不许报「各环都正常」。
  ② **让「关着」看得见**：装上的东西要能回答「此刻在岗还是空转」——⛔ 沉默不许有两种含义。

  ⭐⭐ **还有第二问：能用 ≠ 被用上、≠ 起作用。**「通了」之后还有两道：
  ③ **没人用** ⇒ 东西在、测试也过，但**真实路径上没有任何调用者** ⇒ 它是装饰。
     ⇒ 做完问一句：**谁会用它、什么时候？** ⛔ 只有测试在用 ＝ 没人用。
  ④ **用了但没起作用** ⇒ 中间信号全对（触发了／送到了／调用成功／状态写了／日志有了），
     而**该发生的那个改变没发生**。⛔ 别拿过程指标当结果指标——
     判据：说得出**用它的人会看到什么不一样**，且那个不一样**这次真的观察到了**，⛔ 不是推出来的。
  ⇒ ⭐ 交付时**按三档点名**，⛔ 不许一句「都完成了」盖过去：
     **真做了**（有观察到的效果）／**只搭了架子还没接上**／**这次没做**。
     ⛔ 读报告的人不写代码——他分不出「完整」和「看着完整」，只能靠你说。

  ⭐⭐ ⑤ **写报告那一刻还有最后一道：⛔ 别拿用户的需求原话当你的交付结论。**
  ⚠️ 病的样子：你验的是「按了铃会收到那段话」，写出去却成了「**你授权那一刻它就会收到**」
     ——⭐ 后者是**用户提需求时的原话**。⛔ 不是想骗：**复述他的需求比复述你的实现更顺口**，
     而「顺口」的方向**恒定地朝夸大偏**（需求的范围天然比任何一次具体实现都大）。
  ⚠️ 加重的那一层是**无声的**：你刚端到端验过一次 ⇒ 手里握着「验过了」的自信
     ⇒ 那份自信被扩展到**整条链**上，而扩展的那一步你自己感觉不到。
  ⇒ ⭐ 落笔前对一次账：**我这句话里的每个词，是不是都被我这次真观察到的东西盖住了？**
     · 盖不住的部分 ⇒ 改成「我验的是 X；你要的 Y **还没验**」，⛔ 别合成一句。
     · ⛔ 「应该能」「就会」「从此」这类**能力承诺**，除非你刚看着它发生过，否则⛔ 不许写。
与相邻条目的分工: |
  ⭐ 四条容易看混，⛔ 其实是一条链上不同的位置（2026-08-15 补写，门槛 7）：
  · JF-005 机制验载体 → 「**没有载体**」：某一环靠"希望模型记得"，压根没东西执行它。
  · JF-006 空口交付   → 「**没跑过**」就说好了。
  · JF-013 绿灯不等于对 → 「**跑了、绿了，但绿灯只说明工具和作者当时想法一致**」；
    它也管「没被触发过的规则＝没验过」，⚠️ 但只覆盖**规则与测试**，⛔ 不覆盖交付的功能。
  · 本条 → 「**有载体、跑了、绿了**」之后的**两层**：
      ① 通不通（没接起来／盯的是空的／夹具必然绿）
      ② ⭐ 通了之后**有没有被用上、有没有起作用**（③④ 两问，2026-08-15 加）。
  ⇒ ⛔ 不重叠：前三条问「**做没做、验没验**」，本条问「**做了之后，那件事真的发生了吗**」。
来源事故: |
  同一个病在三层反复出现：
  ① 各功能都做了、数据也齐了，最后**没法用**——⛔ 没人负责把它们接起来；
  ② 机制装上了、脚本也在跑，但**盯的是空目录** ⇒ 永远不会叫，
     而「永远不会叫」跟「平安无事」长得一模一样；
  ③ 测试全绿，但夹具是**按被验对象自己的假设**造的 ⇒ 必然绿。
  ⭐ 后来又补了第二问（能用 ≠ 被用上 ≠ 起作用）：中间信号全对
  （触发了／注入了／调用成功了／日志有了），而**该发生的那个改变没发生**。
