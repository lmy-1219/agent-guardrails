# 实现 档 —— 由 agent-guardrails 附带的模板。
# 📍 用法：把本文件复制到 <你的项目>/.codex/agents/ 或 $CODEX_HOME/agents/
#   ⚠️ 项目级只在**项目受信任**时才加载。复制后开一个新任务才生效。
# —— 以下三条都是 2026-08-18 在真 Codex 宿主上**实测**出来的，⛔ 不是照文档抄的 ——
# ① 每角色的并行数**填了也不生效**：给某个角色设 max_concurrent_threads=1，
#    同一个父任务仍然在约 2.4 秒内起了**两个**该角色的子代理。
#    ⇒ ⭐ 当前唯一真的管用的是**全局**上限，写在 config.toml 的
#      [agents] max_concurrent_threads_per_session。
#    ⚠️ 「字段被解析」⛔ 不等于「限制生效」—— 这一条是拿并发行为反证出来的。
# ② sandbox_mode 对**显式选了角色**的子代理是**真的会收窄**的：
#    父任务以 workspace-write 起，显式指定本角色且这里写 read-only
#    ⇒ 子会话拿到的就是 read-only。
#    ⚠️⚠️ 但**没显式选角色**时不一样：那种继承父任务环境的起法会**继续沿用父任务的权限**。
#    ⇒ ⭐ 判据一句话：**要收窄就必须显式点名角色**，⛔ 别指望默认。
#    （⛔ 这条推翻了本模板 08-16 那版写的「sandbox_mode 只是默认值、父任务放宽会传下去」。）
# ③ 模型档位：子代理**默认逐层继承**父代理的模型与推理档（真跑三层，三层同档）。
#    ⇒ ⭐ 想换档就得**显式指定**，⛔ 别以为改了顶层整棵树就跟着变。
#    ⚠️ 本模板的模型名按 **ChatGPT 桌面应用的 Codex 分页**标定；
#      命令行版曾拒绝过其中一档（`Unknown model`）⇒ 换宿主先试一次再用。
name = "实现"
description = "真动手改东西。⭐ 唯一允许写的一档 ⇒ 派之前先确认这活真的需要写。"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
developer_instructions = """
真动手改东西。⭐ 唯一允许写的一档 ⇒ 派之前先确认这活真的需要写。
"""
