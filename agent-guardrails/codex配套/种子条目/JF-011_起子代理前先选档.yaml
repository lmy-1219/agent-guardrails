# 示范条目（Codex 原生版）。⭐ 给你看「一条规矩长什么样」，⛔ 不是推荐配置。
# 改它、删它都行；生效区里的文件归你，升级插件⛔ 不会覆盖。
id: JF-011
名称: 起子代理前先选档
事件: PreToolUse
# ⭐ collaborationspawn_agent 是 Codex 0.145.0 实测到的原始工具名；
#   Agent 是官方文档声明的兼容匹配名 ⇒ 两个都盯，⛔ 免得换版本就瞎。
工具正则: '^(Agent|collaborationspawn_agent)$'
处置: 拦一次
冷却: 1
作用域: 全局
注入文本: |
  【纠偏 · 起子代理前先选档】你正要起一个子代理。先答三问再决定：
  ① 这活是不是**盘点／抓取／扫描／计数／建索引／逐文件核对**这类体力活？
     是 ⇒ 它该交给便宜的档，⛔ 不该顺手用你自己这一档跑。
  ② 计数、行号、比对这类**工具就能算出来的**，还需要模型吗？零模型最便宜也最准。
  ③ ⭐ **你显式选了哪个角色？** 那个角色里的**模型／推理档位／文件权限**你看过吗？
     ⛔ 不显式指定 ＝ 继承你自己的档 ＝ 整队按最贵的档跑。
     角色模板在插件数据目录的 `角色模板/` 下（抓取／勘察／审计／实现四档）。
  ⇒ 想过了仍判定该这么起 ⇒ **原样再发一次同一调用即放行**（本会话只拦这一次）。
来源事故: |
  一次本该交给便宜档的体力活（读台账、扫代码、数常量），
  主窗却自己拉了 6 个**顶配**子代理去干，烧掉 63 万 token 才被发现。
  ⚠️ 逐项查过：脚本在、引擎在、档位表完好、钩子都挂着 ⇒ ⛔ 不是故障。
  真失效点：这条纪律**只有文档载体、没有执行载体** ——
  事后提醒太晚（活已经派出去了）、收工提醒更晚（钱已经花完了），
  ⭐ 只有「正要动手」那一刻拦得住。
